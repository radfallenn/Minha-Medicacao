<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minha Medicação</title><style>:root{--bg:#0b0d10;--p:#15191f;--p2:#1d232b;--t:#f4f7fb;--m:#99a3b0;--l:#2a323d;--ok:#39d98a;--a:#6ea8fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}header{padding:18px 16px 12px;border-bottom:1px solid var(--l)}h1{margin:0;font-size:22px}.sub,.meta,.small{color:var(--m);font-size:12px}main{padding:14px 14px 90px;max-width:900px;margin:auto}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric b{font-size:21px;display:block}.row{display:flex;align-items:center;gap:9px}.grow{flex:1}.time{font-size:18px;font-weight:800}.name{font-weight:750}.status{font-size:11px;background:var(--p2);padding:4px 7px;border-radius:99px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 12px;background:var(--p2);color:var(--t);font-weight:700}.primary{background:var(--a)!important;color:#07111f!important}.ok{background:var(--ok)!important;color:#06150e!important}input,select{width:100%;padding:11px;background:#0f1318;color:var(--t);border:1px solid var(--l);border-radius:10px}label{display:block;color:var(--m);font-size:11px;margin:8px 0 4px}.form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.wide{grid-column:auto}.progress{height:9px;background:#252c35;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--ok)}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#11151af2;border-top:1px solid var(--l)}nav button{background:none;min-width:86px;color:var(--m)}nav button.active{color:white;border-top:2px solid var(--a)}section{display:none}section.active{display:block}.empty{text-align:center;color:var(--m);padding:25px}@media(max-width:620px){.form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}</style></head><body><header><h1>Minha Medicação</h1><div class="sub" id="date"></div></header><main><section id="hoje" class="active"><div class="grid"><div class="card metric"><b id="taken">0</b><span>Tomadas</span></div><div class="card metric"><b id="pending">0</b><span>Pendentes</span></div><div class="card metric"><b id="rate">0%</b><span>Adesão</span></div></div><div class="card"><div class="row"><b class="grow">Progresso do dia</b><span id="progText">0/0</span></div><div class="progress"><i id="prog"></i></div></div><div class="card"><div class="row"><div class="grow"><b>Notificações Android</b><div class="small">Alarmes são programados no aparelho e podem funcionar com o app fechado.</div></div><button class="primary" onclick="activateNotifications()">Ativar</button></div></div><div id="todayList"></div></section><section id="medicamentos"><div class="card"><b>Novo medicamento</b><div class="form"><div class="wide"><label>Nome</label><input id="name" placeholder="Medicamento"></div><div><label>Dose</label><input id="dose" placeholder="50 mg"></div><div><label>Horário</label><input id="time" type="time" value="08:00"></div><div><label>Estoque</label><input id="stock" type="number" value="30" min="0"></div><div><label>Qtd. por dose</label><input id="perDose" type="number" value="1" min=".25" step=".25"></div><div><label>Tipo</label><select id="type"><option value="fixo">Uso diário</option><option value="prn">Se necessário</option></select></div><div class="wide"><label>Observação</label><input id="note" placeholder="Ex.: após o café"></div></div><div class="actions"><button class="primary" onclick="addMed()">Adicionar</button></div></div><div class="card"><b>Banco local</b><div class="small" id="dbStatus">Inicializando IndexedDB...</div><div class="actions"><button onclick="exportBackup()">Exportar backup</button><button onclick="backupFile.click()">Restaurar backup</button><input id="backupFile" type="file" accept=".json" style="display:none" onchange="importBackup(event)"></div></div><div id="medList"></div></section><section id="historico"><div id="historyList"></div></section><section id="estoque"><div id="stockList"></div></section></main><nav><button class="active" onclick="show('hoje',this)">Hoje</button><button onclick="show('medicamentos',this)">Remédios</button><button onclick="show('historico',this)">Histórico</button><button onclick="show('estoque',this)">Estoque</button></nav><script>const DB='MinhaMedicacaoDB',STORE='state',KEY='appState';let idb,db={meds:[],logs:[]};const $=id=>document.getElementById(id),iso=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openDB(){return new Promise((r,j)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}function getDB(){return new Promise((r,j)=>{let q=idb.transaction(STORE).objectStore(STORE).get(KEY);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}function putDB(){return new Promise((r,j)=>{let t=idb.transaction(STORE,'readwrite');t.objectStore(STORE).put(db,KEY);t.oncomplete=r;t.onerror=()=>j(t.error)})}function syncNative(){try{if(window.Android&&Android.scheduleAll)Android.scheduleAll(JSON.stringify(db.meds.filter(m=>m.type==='fixo')))}catch(e){}}async function init(){try{idb=await openDB();let x=await getDB();if(x)db=x;else await putDB();$('dbStatus').textContent='IndexedDB ativo · dados salvos neste aparelho'}catch(e){$('dbStatus').textContent='Falha ao abrir banco local'}render();syncNative()}async function save(){await putDB();syncNative();render()}function show(id,b){document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function logFor(id){return db.logs.find(x=>x.medId===id&&x.date===iso()&&['tomado','nao'].includes(x.action))}async function addMed(){let n=$('name').value.trim();if(!n)return alert('Digite o nome.');db.meds.push({id:uid(),name:n,dose:$('dose').value.trim(),time:$('time').value||'08:00',stock:+$('stock').value||0,perDose:+$('perDose').value||1,type:$('type').value,note:$('note').value.trim()});$('name').value='';$('dose').value='';$('note').value='';await save()}async function take(id){let m=db.meds.find(x=>x.id===id);if(!m||logFor(id))return;db.logs.unshift({id:uid(),medId:id,date:iso(),at:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),action:'tomado',name:m.name,dose:m.dose});m.stock=Math.max(0,m.stock-m.perDose);await save()}async function skip(id){let m=db.meds.find(x=>x.id===id);if(!m||logFor(id))return;db.logs.unshift({id:uid(),medId:id,date:iso(),at:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),action:'nao',name:m.name,dose:m.dose});await save()}async function editMed(id){let m=db.meds.find(x=>x.id===id);if(!m)return;let n=prompt('Nome:',m.name);if(n===null)return;let d=prompt('Dose:',m.dose);if(d===null)return;let h=m.time;if(m.type==='fixo'){h=prompt('Horário HH:MM:',m.time);if(h===null)return;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(h.trim()))return alert('Horário inválido. Ex.: 08:00')}let st=prompt('Estoque:',m.stock);if(st===null)return;let pd=prompt('Quantidade por dose:',m.perDose);if(pd===null)return;let nt=prompt('Observação:',m.note||'');if(nt===null)return;m.name=n.trim();m.dose=d.trim();m.time=h.trim();m.stock=Math.max(0,+String(st).replace(',','.')||0);m.perDose=Math.max(.25,+String(pd).replace(',','.')||1);m.note=nt.trim();await save()}async function removeMed(id){if(confirm('Excluir da rotina? O histórico será mantido.')){db.meds=db.meds.filter(x=>x.id!==id);await save()}}async function takePRN(id){let m=db.meds.find(x=>x.id===id);if(!m)return;db.logs.unshift({id:uid(),medId:id,date:iso(),at:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),action:'tomado',name:m.name,dose:m.dose});m.stock=Math.max(0,m.stock-m.perDose);await save()}function activateNotifications(){syncNative();alert('Lembretes sincronizados com o Android. Confira também as permissões de notificação e alarmes do aplicativo.')}function exportBackup(){let blob=new Blob([JSON.stringify({version:1,data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minha-medicacao-'+iso()+'.json';a.click()}async function importBackup(e){try{let x=JSON.parse(await e.target.files[0].text()),d=x.data||x;if(!Array.isArray(d.meds)||!Array.isArray(d.logs))throw 0;if(confirm('Restaurar este backup?')){db=d;await save()}}catch(_){alert('Backup inválido')}e.target.value=''}function render(){$('date').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});let fixed=db.meds.filter(m=>m.type==='fixo').sort((a,b)=>a.time.localeCompare(b.time)),tk=fixed.filter(m=>logFor(m.id)?.action==='tomado').length,rt=fixed.length?Math.round(tk/fixed.length*100):0;$('taken').textContent=tk;$('pending').textContent=fixed.length-tk;$('rate').textContent=rt+'%';$('progText').textContent=tk+'/'+fixed.length;$('prog').style.width=rt+'%';$('todayList').innerHTML=fixed.length?fixed.map(m=>{let l=logFor(m.id);return `<div class="card"><div class="row"><div class="time">${esc(m.time)}</div><div class="grow"><div class="name">${esc(m.name)} <span class="status">${esc(m.dose)}</span></div><div class="meta">${esc(m.note||'Sem observação')} · estoque ${m.stock}</div></div><span class="status">${l?(l.action==='tomado'?'✓ '+l.at:'Não tomado'):'Pendente'}</span></div>${!l?`<div class="actions"><button class="ok" onclick="take('${m.id}')">✓ Tomei</button><button onclick="skip('${m.id}')">Não tomei</button></div>`:''}</div>`}).join(''):'<div class="card empty">Cadastre seu primeiro medicamento.</div>';$('medList').innerHTML=db.meds.map(m=>`<div class="card"><div class="row"><div class="grow"><div class="name">${esc(m.name)} · ${esc(m.dose)}</div><div class="meta">${m.type==='prn'?'Se necessário':'Diário às '+esc(m.time)} · ${esc(m.note)}</div></div><button class="primary" onclick="editMed('${m.id}')">Editar</button><button onclick="removeMed('${m.id}')">Excluir</button></div>${m.type==='prn'?`<div class="actions"><button class="ok" onclick="takePRN('${m.id}')">Registrar uso agora</button></div>`:''}</div>`).join('')||'<div class="card empty">Nenhum medicamento.</div>';$('historyList').innerHTML=db.logs.length?db.logs.slice(0,200).map(l=>`<div class="card"><b>${esc(l.name)} ${esc(l.dose)}</b><div class="meta">${l.date.split('-').reverse().join('/')} · ${l.at} · ${l.action==='tomado'?'Tomado':'Não tomado'}</div></div>`).join(''):'<div class="card empty">Sem histórico.</div>';$('stockList').innerHTML=db.meds.length?db.meds.map(m=>`<div class="card"><div class="row"><div class="grow"><b>${esc(m.name)}</b><div class="meta">${esc(m.dose)}</div></div><b>${m.stock}</b></div><div class="small">≈ ${Math.floor(m.stock/m.perDose)} doses disponíveis</div></div>`).join(''):'<div class="card empty">Sem estoque cadastrado.</div>'}init();</script></body></html>
